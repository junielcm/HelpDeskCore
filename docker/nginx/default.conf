server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Adjuntos de tickets (ver .env -> FILESYSTEM_DISK / ticket attachments)
    client_max_body_size 32M;

    # Laravel ya envia su propio header de cache en las respuestas
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Rutas de la SPA y de la API
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Los errores de la aplicacion los renderiza Laravel
    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Archivos publicos cacheables (build de Vite, fuentes, imagenes)
    location ~* \.(?:css|js|mjs|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Nunca servir archivos ocultos (.env, .git, ...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
