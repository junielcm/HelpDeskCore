; Ajustes de PHP para HelpDeskCore dentro del contenedor.

expose_php = Off
memory_limit = 512M
max_execution_time = 120

; Adjuntos de tickets
upload_max_filesize = 32M
post_max_size = 32M
max_file_uploads = 20

; Laravel fija la zona horaria de la aplicacion desde config/app.php, este
; valor solo cubre la CLI de PHP (artisan, colas).
date.timezone = UTC

; Errores visibles solo cuando APP_DEBUG esta activo (lo gestiona Laravel)
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.save_comments = 1

; validate_timestamps se deja activo para que el modo dev (codigo montado por
; volumen) recargue los cambios sin reconstruir la imagen.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
